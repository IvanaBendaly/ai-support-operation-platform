[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-support"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143,<0.144", "pydantic>=2.14,<3", "pydantic-settings>=2.15,<3",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "docling-slim[format-docx,format-pdf-docling,convert-core]==2.143.0",
  "uvicorn>=0.34,<1", "pypdf>=6.21,<7", "numpy>=2.4,<3", "python-multipart>=0.0.22,<0.1",
  "liteparse==2.17.0", "boto3>=1.43,<2", "httpx2>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2,<3", "ruff>=0.9,<1",
       "setuptools>=75,<83", "wheel>=0.48,<1"]

[tool.setuptools.packages.find]
include = ["northstar*"]

[tool.setuptools.package-data]
northstar = ["migrations/script.py.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires NORTHSTAR_TEST_DATABASE_URL pointing to a disposable PostgreSQL database",
           "integration: requires explicitly configured external local services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
