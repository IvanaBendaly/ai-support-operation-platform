services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-northstar}
      POSTGRES_USER: ${POSTGRES_USER:-northstar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: ./backend
    environment: &backend_environment
      NORTHSTAR_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-northstar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-northstar}
      NORTHSTAR_ALLOWED_ORIGINS: '["http://localhost:8080"]'
    depends_on:
      db: { condition: service_healthy }
    command: ["alembic", "upgrade", "head"]
    restart: "no"
  backend:
    build: ./backend
    environment:
      <<: *backend_environment
      NORTHSTAR_ADMIN_TOKEN: ${NORTHSTAR_ADMIN_TOKEN:-}
      NORTHSTAR_RETRIEVAL__RESULT_LIMIT: ${NORTHSTAR_RETRIEVAL__RESULT_LIMIT:-5}
      NORTHSTAR_RETRIEVAL__CONTEXT_CHARS: ${NORTHSTAR_RETRIEVAL__CONTEXT_CHARS:-8000}
      NORTHSTAR_RETRIEVAL__SECTION_CHARS: ${NORTHSTAR_RETRIEVAL__SECTION_CHARS:-2000}
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 5
  worker:
    build: ./backend
    environment: *backend_environment
    depends_on:
      migrate: { condition: service_completed_successfully }
    command: ["python", "-m", "northstar.retrieval.worker"]
    restart: unless-stopped
    mem_limit: 1g
volumes:
  postgres_data:
